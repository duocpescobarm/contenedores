name: Seguridad del Pipeline

on:
  push:
    branches:
      - main

jobs:
  snyk:
    name: Analisis de dependencias (Snyk / SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Analizar con Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  sonarcloud:
    name: Analisis de codigo (SonarCloud / SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}